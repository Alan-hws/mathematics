<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title desc"><title id="title">条件概率的样本空间</title><desc id="desc">公平骰子结果一至六，其中偶数为二四六，已知偶数后大于四的结果只有六。</desc><rect width="640" height="250" fill="white"/><g font-family="sans-serif" font-size="25" text-anchor="middle"><g fill="#edf2ee" stroke="#82988a" stroke-width="2"><rect x="40" y="70" width="80" height="70" rx="8"/><rect x="140" y="70" width="80" height="70" rx="8"/><rect x="240" y="70" width="80" height="70" rx="8"/><rect x="340" y="70" width="80" height="70" rx="8"/><rect x="440" y="70" width="80" height="70" rx="8"/><rect x="540" y="70" width="60" height="70" rx="8"/></g><g fill="#d7eee2"><rect x="142" y="72" width="76" height="66" rx="6"/><rect x="342" y="72" width="76" height="66" rx="6"/></g><rect x="542" y="72" width="56" height="66" rx="6" fill="#f2c9af"/><g fill="#344a3d"><text x="80" y="115">1</text><text x="180" y="115">2</text><text x="280" y="115">3</text><text x="380" y="115">4</text><text x="480" y="115">5</text><text x="570" y="115">6</text></g><text x="320" y="190" font-size="19" fill="#344a3d">已知偶数：2、4、6；其中大于 4：只有 6</text><text x="320" y="220" font-size="19" fill="#344a3d">P(大于 4 | 偶数) = 1/3</text></g></svg>
