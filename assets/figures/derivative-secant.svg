<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc"><title id="title">割线、切线与导数</title><desc id="desc">抛物线y等于x平方上，一一和二四两点间割线斜率为三；一一处切线斜率为二。</desc><rect width="640" height="390" fill="white"/><g stroke="#e6ece7"><path d="M60 300H590 M60 240H590 M60 180H590 M60 120H590 M60 60H590 M150 35V335 M210 35V335 M270 35V335 M330 35V335 M390 35V335 M450 35V335"/></g><path d="M65 300H590 M150 335V35" stroke="#42594d" stroke-width="2"/><path d="M90 240 Q150 360 210 240 Q240 180 270 60 Q276 36 282 9.6" fill="none" stroke="#27705a" stroke-width="4"/><path d="M120 360L285 30" stroke="#c77850" stroke-width="3"/><path d="M190 300L280 30" stroke="#728cb1" stroke-width="3" stroke-dasharray="7 5"/><circle cx="210" cy="240" r="6" fill="#27705a"/><circle cx="270" cy="60" r="6" fill="#27705a"/><g font-family="sans-serif" font-size="18" fill="#344a3d"><text x="220" y="260">P(1,1)</text><text x="280" y="65">Q(2,4)</text><text x="390" y="100">y = x²</text><text x="360" y="140" fill="#c77850">切线：斜率 2</text><text x="360" y="170" fill="#728cb1">割线：斜率 3</text><text x="572" y="324">x</text><text x="160" y="48">y</text><text x="130" y="325">0</text></g></svg>
