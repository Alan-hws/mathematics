<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">用小矩形理解定积分</title><desc id="d">在零到二之间用四个右端点矩形近似直线y等于x下的面积。</desc><rect width="640" height="300" fill="white"/><path d="M80 245H570 M100 260V25" stroke="#42594d" stroke-width="2"/><g fill="#d7eee2" stroke="#80a891" stroke-width="2"><rect x="100" y="205" width="80" height="40"/><rect x="180" y="165" width="80" height="80"/><rect x="260" y="125" width="80" height="120"/><rect x="340" y="85" width="80" height="160"/></g><path d="M100 245L420 85" stroke="#27705a" stroke-width="4"/><g fill="#344a3d" font-family="sans-serif" font-size="19"><text x="92" y="270">0</text><text x="410" y="270">2</text><text x="435" y="82">y = x</text><text x="180" y="40">每个矩形宽 0.5</text><text x="170" y="290">定积分是分割变细时和的极限</text></g></svg>
