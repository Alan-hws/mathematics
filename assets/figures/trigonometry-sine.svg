<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-labelledby="title desc"><title id="title">一个周期内的正弦函数</title><desc id="desc">正弦函数在 0、π、2π 处为零，在 π/2 处为 1，在 3π/2 处为 −1。</desc><rect width="660" height="380" fill="white"/><g stroke="#e5ebe5"><path d="M55 70H615M55 160H615M55 250H615M196.25 40V285M322.5 40V285M448.75 40V285M575 40V285"/></g><path d="M45 160H615M70 290V32" stroke="#40584c" stroke-width="2"/><path d="M70 160 C112 160 154.25 70 196.25 70 C238.25 70 280.5 160 322.5 160 C364.5 160 406.75 250 448.75 250 C490.75 250 533 160 575 160" fill="none" stroke="#27705a" stroke-width="4"/><g fill="#c77850"><circle cx="70" cy="160" r="4"/><circle cx="196.25" cy="70" r="4"/><circle cx="322.5" cy="160" r="4"/><circle cx="448.75" cy="250" r="4"/><circle cx="575" cy="160" r="4"/></g><g font-family="sans-serif" font-size="19" fill="#334b3d" text-anchor="middle"><text x="70" y="315">0</text><text x="196.25" y="315">π/2</text><text x="322.5" y="315">π</text><text x="448.75" y="315">3π/2</text><text x="575" y="315">2π</text><text x="43" y="76">1</text><text x="43" y="256">−1</text><text x="610" y="151">x</text><text x="83" y="38">y</text></g></svg>
