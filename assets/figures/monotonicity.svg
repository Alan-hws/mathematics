<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">二次函数分区间递减与递增</title><desc id="desc">抛物线 y=x² 从左向右先下降，经过顶点后上升；在 x 小于零时递减，大于零时递增。</desc>
<rect width="640" height="400" fill="white"/><g stroke="#e5ebe5" stroke-width="1"><path d="M80 100H560M80 180H560M80 260H560M160 40V340M240 40V340M400 40V340M480 40V340"/></g><path d="M80 320H565M320 345V35" stroke="#40584c" stroke-width="2"/><path d="M555 315l10 5-10 5M315 45l5-10 5 10" fill="none" stroke="#40584c" stroke-width="2"/>
<path d="M160 64 Q240 320 320 320" fill="none" stroke="#ca7851" stroke-width="4"/><path d="M320 320 Q400 320 480 64" fill="none" stroke="#27705a" stroke-width="4"/>
<circle cx="320" cy="320" r="5" fill="#40584c"/><g font-family="sans-serif" font-size="18" fill="#40584c"><text x="572" y="325">x</text><text x="330" y="40">y</text><text x="326" y="342">0</text><text x="90" y="72" fill="#ad5633">decreasing</text><text x="420" y="72" fill="#27705a">increasing</text><text x="470" y="205">y = x²</text></g></svg>
