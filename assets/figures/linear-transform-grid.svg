<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t d"><title id="t">矩阵如何变换向量</title><desc id="d">矩阵把基向量一零变成二零，把零一变成零一，因此一一变成二一。</desc><rect width="640" height="290" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27705a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c77850"/></marker></defs><path d="M55 230H275 M90 260V35 M350 230H610 M385 260V35" stroke="#42594d" stroke-width="2"/><path d="M90 230L150 170" stroke="#27705a" stroke-width="4" marker-end="url(#a)"/><path d="M385 230L505 170" stroke="#c77850" stroke-width="4" marker-end="url(#b)"/><g font-family="sans-serif" font-size="19" fill="#344a3d"><text x="135" y="155">x=(1,1)</text><text x="480" y="155">Ax=(2,1)</text><text x="265" y="125">A →</text><text x="185" y="275">A = diag(2,1)</text><text x="390" y="55">横向拉伸 2 倍</text></g></svg>
